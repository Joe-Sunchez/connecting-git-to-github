<style>

body{background:#fff;background-image:none}

o('areas')">یک سفارش دیگر</button></div>`:`<div class="card rw"><h3>🎁 با اولین سفارش، باشگاه را شروع کن</h3><p>هر سفارش ۱ امتیاز؛ ۵ امتیاز = یک نوشیدنی رایگان.</p><button class="btn" onclick="go('login')">ورود و شروع</button></div>`}<h2>درباره کافه‌چی</h2><div class="grid"><div class="card"><h3>🍵 حال‌وهوای قدیم</h3>کافه‌چی کافه‌ها و چای‌خانه‌های محله‌های مشهد را کنار هم آورده تا انتخاب و سفارش ساده شود.</div><div class="card"><h3>🛵 حضوری یا پیک</h3>خودتان بیایید یا سفارش را به در خانه بفرستیم.</div><div class="card"><h3>🎁 باشگاه مشتریان</h3>با هر سفارش یک امتیاز؛ با ۵ امتیاز نوشیدنی هدیه بگیرید.</div><div class="card"><h3>⭐ رده‌بندی منصفانه</h3>کیفیت و قیمت هر کافه را شما امتیاز می‌دهید.</div></div><h2>کافه‌دار هستید؟ 🏺</h2><div class="own"><div class="card"><h3>مشتری بیشتر، دردسر کمتر</h3><ul class="ul"><li>سفارش آنلاین، حضوری و پیکی</li><li>لیست خرید خودکار وقتی چیزی تمام می‌شود</li><li>گزارش فروش، هزینه و سود</li><li>پنل پیامکی برای باشگاه مشتریان</li><li>مدیریت حضور و غیاب کارکنان</li></ul><input id="ln" placeholder="نام شما"><input id="lc" placeholder="نام کافه"><input id="lp" placeholder="شماره موبایل" inputmode="numeric" maxlength="11"><button class="btn" onclick="lead()">ثبت کافه‌ی من</button></div><div class="card calc"><h3>محاسبه‌ی فروش نمونه</h3>سفارش روزانه‌ی فعلی<input id="c1" type="number" value="40" oninput="calc()">میانگین هر سفارش (هزار تومان)<input id="c2" type="number" value="80" oninput="calc()">افزایش فروش از سفارش آنلاین: <b id="c3v"></b><input id="c3" type="range" min="0" max="40" value="10" oninput="calc()"><div class="res">فروش ماهانه‌ی فعلی: <b id="r1"></b> میلیون تومان<br>فروش اضافه در ماه: <b id="r2"></b> میلیون تومان</div><p class="mu">این فقط یک برآورد است و درصد افزایش را خودتان تعیین می‌کنید.</p></div></div>`,

function mascotSay(){const m=["خوش اومدی! یه چای تازه‌دم بفرما ☕","محله‌ات رو بگو، بهترین کافه‌ها رو نشونت بدم","با هر سفارش یه امتیاز می‌گیری 🎁","امروز چای ذغالی داریم، میل داری؟"],a=document.querySelector(".hero-c");alert(m[Math.floor(Math.random()*m.length)]);if(a){a.classList.remove("hop");void a.offsetWidth;a.classList.add("hop")}}
function pcalc(){const d=$("#pm").value=="up"?1:-1,v=+$("#pv").value||0,u=$("#pu").value,st=+$("#pr").value,sel=document.querySelector("input[name=ps]:checked").value=="sel",ch=[...document.querySelectorAll(".sel:checked")].map(x=>x.value);return menu(CAFES[0]).filter(m=>!sel||ch.includes(m[0])).map(m=>{let n=u=="pct"?m[1]*(1+d*v/100):m[1]+d*v;n=st?Math.round(n/st)*st:n;return [m[0],m[1],Math.max(st||1,n)]})}
function pbulk(prev){const l=pcalc();if(!l.length)return alert("آیتمی انتخاب نشده است");if(prev){$("#pvw").innerHTML=tbl(["آیتم","قیمت فعلی","قیمت جدید"],l.map(r=>[r[0],fa(r[1]),fa(r[2])]));return}l.forEach(r=>S.pr["1|"+r[0]]=r[2]);save();alert(fa(l.length)+" قیمت تغییر کرد");draw()}
function tg(n){const k="1|"+n;S.stock[k]=!S.stock[k];save();draw()}
addEventListener("storage",()=>{try{const x=JSON.parse(localStorage.getItem("cafechi"));S.stock=x.stock||{};S.hrs=x.hrs||S.hrs;S.pr=x.pr||{};draw()}catch(e){}});
function total(c){return Object.entries(S.cart).reduce((a,[i,q])=>a+menu(c)[i][1]*q,0)}
function add(i,d){if(d>0)fly(window.event,"☕");S.cart[i]=Math.max(0,(S.cart[i]||0)+d);draw()}
function cmp(id){const i=S.cmp.indexOf(id);i<0?(S.cmp.length<3&&S.cmp.push(id)):S.cmp.splice(i,1);draw()}
function pay(){const c=CAFES.find(x=>x.id==S.cafe),t=total(c);if(!t)return alert("سبد خالی است");if(c.id==1&&!S.hrs.open)return alert("کافه الان بسته است");if(S.mode=="out"&&!$("#ad").value)return alert("نشانی را بنویسید");
 if(!confirm("درگاه پرداخت نمایشی: پرداخت "+fa(t)+" هزار تومان؟"))return;S.pts++;S.orders.push({c:c.id,i:{...S.cart},d:new Date().toISOString().slice(0,10),t:t+(S.mode=="out"?15:0)});S.tmpOrder={mode:S.mode};save();go("done");confetti()}
function rate(){const id=S.cafe;(S.rate[id]=S.rate[id]||[]).push([+$("#r1").value,+$("#r2").value]);save();alert("سپاس از امتیاز شما");go("areas")}
function login(){const p=$("#ph").value.trim();if(!/^09\d{9}$/.test(p)){$("#er").textContent="شماره معتبر نیست";return}
 if($("#cw").style.display=="none"){$("#cw").style.display="block";$("#lb").textContent="ورود";$("#er").textContent="کد ۱۲۳۴ را وارد کنید";return}
 if($("#cd").value!="1234"){$("#er").textContent="کد اشتباه است";return}
 S.u={phone:p,role:p=="09120000000"?"admin":"customer"};save();go(S.u.role=="admin"?"admin":"areas")}
function addp(){const n=$("#pn").value,p=+$("#pp").value;if(n&&p){(S.prods.x=S.prods.x||[]).push([n,p]);save();draw()}}
function adds(){const n=$("#sn").value,r=$("#sr").value,p=+$("#sp").value;if(n&&p){S.staff.push([n,r,p]);save();draw()}}
function draw(){nav();const a=$("#app"),k=S.v+(S.v=="admin"?S.tab:""),b=document.querySelector(".cartbtn b");if(b&&cn()!=draw.c)b.classList.add("bump");draw.c=cn();a.dataset.v=S.v;a.className=k!=draw.k?"enter":"";draw.k=k;a.innerHTML=V[S.v]();cnt()}
