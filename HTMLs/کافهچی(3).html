 return `<h2>پنل مدیریت</h2><p class="adm">🏺 ${CAFES[0].n}</p><div class="tabs">${t.map(x=>`<button class="btn ${S.tab==x[0]?"":"alt"}" onclick="S.tab='${x[0]}';draw()">${x[1]}</button>`).join("")}</div>`+A[S.tab]()}};

function chart(){const d=[];for(let i=6;i>=0;i--){const x=new Date();x.setDate(x.getDate()-i);d.push(x)}const base=[420,380,510,460,600,720,0],iso=x=>x.toISOString().slice(0,10),v=d.map((x,i)=>base[i]+S.orders.filter(o=>o.c==1&&(o.d||iso(new Date()))==iso(x)).reduce((a,o)=>a+o.t,0)),mx=Math.max(...v,1);return `<svg viewBox="0 0 350 180" style="width:100%;max-width:520px">${v.map((n,i)=>{const h=n/mx*120;return `<rect x="${i*50+10}" y="${140-h}" width="30" height="${h}" fill="#D53E0F" rx="3"/><text x="${i*50+25}" y="${134-h}" font-size="10" text-anchor="middle" fill="#3a0a05">${fa(n)}</text><text x="${i*50+25}" y="158" font-size="10" text-anchor="middle" fill="#7a4a3a">${d[i].toLocaleDateString("fa-IR",{weekday:"short"})}</text>`}).join("")}</svg>`}

addEventListener("pointermove",e=>{const t=e.target.closest&&e.target.closest(".card,.cat,.pick,.hero");if(!t)return;const r=t.getBoundingClientRect();t.style.setProperty("--px",e.clientX-r.left+"px");t.style.setProperty("--py",e.clientY-r.top+"px");if(t.classList.contains("hero")){t.style.setProperty("--mx",(e.clientX-r.left)/r.width-.5);t.style.setProperty("--my",(e.clientY-r.top)/r.height-.5)}});
addEventListener("click",e=>{const b=e.target.closest&&e.target.closest(".btn");if(!b||rm)return;const r=b.getBoundingClientRect(),s=document.createElement("span"),d=Math.max(r.width,r.height)*2;s.className="rip";s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;b.appendChild(s);setTimeout(()=>s.remove(),600)})})();
function fly(e,ch){if(matchMedia("(prefers-reduced-motion:reduce)").matches||!e||!e.target.getBoundingClientRect)return;const c=document.querySelector(".cartbtn");if(!c)return;const a=e.target.getBoundingClientRect(),b=c.getBoundingClientRect(),s=document.createElement("div");s.textContent=ch;s.style.cssText=`position:fixed;z-index:50;font-size:1.4rem;pointer-events:none;left:${a.left}px;top:${a.top}px`;document.body.appendChild(s);s.animate([{transform:"translate(0,0) scale(1)",opacity:1},{transform:`translate(${b.left-a.left}px,${b.top-a.top}px) scale(.3)`,opacity:.3}],{duration:750,easing:"cubic-bezier(.5,-.3,.9,.5)"}).onfinish=()=>s.remove()}
function confetti(){if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;const k=["#5E0006","#9B0F06","#D53E0F","#EED9B9"];for(let i=0;i<70;i++){const s=document.createElement("i");s.style.cssText=`position:fixed;z-index:60;left:${innerWidth/2}px;top:${innerHeight/3}px;width:8px;height:12px;background:${k[i%4]};pointer-events:none`;document.body.appendChild(s);s.animate([{transform:"translate(0,0) rotate(0)",opacity:1},{transform:`translate(${(Math.random()-.5)*innerWidth*.9}px,${innerHeight*.5+Math.random()*innerHeight*.4}px) rotate(${Math.random()*720}deg)`,opacity:0}],{duration:1400+Math.random()*900,easing:"cubic-bezier(.2,.7,.4,1)"}).onfinish=()=>s.remove()}}
function tg(n){const k="1|"+n;S.stock[k]=!S.stock[k];save();draw()}
addEventListener("storage",()=>{try{const x=JSON.parse(localStorage.getItem("cafechi"));S.stock=x.stock||{};S.hrs=x.hrs||S.hrs;draw()}catch(e){}});
function total(c){return Object.entries(S.cart).reduce((a,[i,q])=>a+menu(c)[i][1]*q,0)}
function add(i,d){if(d>0)fly(window.event,"☕");S.cart[i]=Math.max(0,(S.cart[i]||0)+d);draw()}
function cmp(id){const i=S.cmp.indexOf(id);i<0?(S.cmp.length<3&&S.cmp.push(id)):S.cmp.splice(i,1);draw()}
function pay(){const c=CAFES.find(x=>x.id==S.cafe),t=total(c);if(!t)return alert("سبد خالی است");if(c.id==1&&!S.hrs.open)return alert("کافه الان بسته است");if(S.mode=="out"&&!$("#ad").value)return alert("نشانی را بنویسید");
 if(!confirm("درگاه پرداخت نمایشی: پرداخت "+fa(t)+" هزار تومان؟"))return;S.pts++;S.orders.push({c:c.id,d:new Date().toISOString().slice(0,10),t:t+(S.mode=="out"?15:0)});S.tmpOrder={mode:S.mode};save();go("done");confetti()}
function rate(){const id=S.cafe;(S.rate[id]=S.rate[id]||[]).push([+$("#r1").value,+$("#r2").value]);save();alert("سپاس از امتیاز شما");go("areas")}
function login(){const p=$("#ph").value.trim();if(!/^09\d{9}$/.test(p)){$("#er").textContent="شماره معتبر نیست";return}
 if($("#cw").style.display=="none"){$("#cw").style.display="block";$("#lb").textContent="ورود";$("#er").textContent="کد ۱۲۳۴ را وارد کنید";return}
 if($("#cd").value!="1234"){$("#er").textContent="کد اشتباه است";return}
 S.u={phone:p,role:p=="09120000000"?"admin":"customer"};save();go(S.u.role=="admin"?"admin":"areas")}
function addp(){const n=$("#pn").value,p=+$("#pp").value;if(n&&p){(S.prods.x=S.prods.x||[]).push([n,p]);save();draw()}}
function adds(){const n=$("#sn").value,r=$("#sr").value,p=+$("#sp").value;if(n&&p){S.staff.push([n,r,p]);save();draw()}}
function draw(){nav();const a=$("#app"),k=S.v+(S.v=="admin"?S.tab:""),b=document.querySelector(".cartbtn b");if(b&&cn()!=draw.c)b.classList.add("bump");draw.c=cn();a.dataset.v=S.v;a.className=k!=draw.k?"enter":"";draw.k=k;a.innerHTML=V[S.v]()}
draw();
</script>
