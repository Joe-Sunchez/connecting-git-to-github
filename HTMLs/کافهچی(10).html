<footer><div class="ft"><div><div class="fl">کافه‌چی</div><p>سفارش از کافه‌های مشهد؛ حضوری یا با پیک.</p></div><div><h4>دسترسی سریع</h4><a onclick="go('areas')">کافه‌ها</a><a onclick="go('club')">باشگاه مشتریان</a><a onclick="go('blog')">وبلاگ</a><a onclick="go('contact')">تماس با ما</a></div><div><h4>کافه‌دارها</h4><a onclick="go('home');setTimeout(()=>{const e=document.getElementById('own');e&&e.scrollIntoView({behavior:'smooth'})},80)">ثبت کافه‌ی من</a><a onclick="go('login')">ورود به پنل</a></div><div><h4>ارتباط با ما</h4><p>تلفن: ـــــ</p><p>نشانی: مشهد، ـــــ</p><p>اینستاگرام: ـــــ</p></div></div><div class="fb">© کافه‌چی · مشهد</div></footer>
<noscript>برای استفاده از کافه‌چی، جاوااسکریپت مرورگر را فعال کنید.</noscript>
<script>
const $=s=>document.querySelector(s);
const fa=n=>Number(n).toLocaleString("fa-IR");
const AREAS=["وکیل‌آباد","احمدآباد","سجاد","هاشمیه","ملک‌آباد","امامت"];
const CAFES=[
{id:1,n:"چای‌خانه سنتی سرای قدیم",a:"وکیل‌آباد",r:4.6,p:2,g:["🍵","🪔","🏺"],m:[["چای ذغالی",40],["قهوه ترک",60],["دمنوش بهارنارنج",55],["نان و پنیر و سبزی",70]]},
{id:2,n:"کافه سماور",a:"وکیل‌آباد",r:4.3,p:1,g:["☕","🫖","🍰"],m:[["لاته",75],["چای سماوری",35],["کیک شکلاتی",80],["قلیان‌نبات",45]]},
{id:3,n:"قهوه‌خانه شاه‌عباسی",a:"احمدآباد",r:4.8,p:3,g:["🏺","🍵","🕌"],m:[["دیزی",150],["چای شاه‌عباسی",50],["شیرینی سنتی",65],["اسپرسو",55]]},
{id:4,n:"کافه باغ‌نو",a:"سجاد",r:4.1,p:2,g:["🌿","☕","🥐"],m:[["کاپوچینو",80],["کروسان",60],["آیس‌کافی",85],["چای ماسالا",65]]},
{id:5,n:"چایخانه حافظ",a:"احمدآباد",r:4.5,p:1,g:["📜","🍵","🌹"],m:[["چای گل‌گاوزبان",45],["حلوا",40],["قهوه فرانسه",60],["کیک یزدی",50]]},
{id:6,n:"کافه گلشن",a:"هاشمیه",r:4.2,p:2,g:["🌸","☕","🧁"],m:[["موکا",90],["چای لیمو",40],["چیزکیک",95],["شیر کاکائو",50]]}];
const BLOG=[["چای ذغالی چگونه دم می‌شود؟","رمز یک چای خوب، آتش ملایم ذغال و صبر است. چای را روی سماور بگذارید تا عطرش کم‌کم بنشیند."],["تاریخچه قهوه‌خانه‌ها در ایران","قهوه‌خانه‌ها قرن‌ها جای گفت‌وگو، نقالی و شاهنامه‌خوانی بوده‌اند."],["بهترین زمان نوشیدن دمنوش","دمنوش‌های گیاهی بعد از شام آرامش‌بخش‌اند."]];
let S={v:"home",u:null,area:null,cafe:null,cart:{},mode:"in",pts:0,orders:[],rate:{},cmp:[],prods:{},staff:[["علی رضایی","صندوق‌دار",9000],["مریم احمدی","باریستا",11000]],sms:[],stock:{},pr:{},ev:"auto",spec:null,fav:[],oid:0,users:{},posts:null,imgs:{},log:[],club:null,xc:[],alb:{},dl:{},att:{},hlog:[],hrs:{o:"08:00",c:"23:00",open:true},tab:"ord",tmpOrder:null};
try{const x=localStorage.getItem("cafechi");if(x)S={...S,...JSON.parse(x),v:"home",cart:{},tmpOrder:null}}catch(e){}
function save(){if(S.u&&S.users&&S.users[S.u.phone])S.users[S.u.phone].pts=S.pts;try{localStorage.setItem("cafechi",JSON.stringify({u:S.u,pts:S.pts,orders:S.orders,rate:S.rate,prods:S.prods,staff:S.staff,sms:S.sms,stock:S.stock,att:S.att,hlog:S.hlog,leads:S.leads,pr:S.pr,ev:S.ev,spec:S.spec,fav:S.fav,comm:S.comm,oid:S.oid,users:S.users,posts:S.posts,imgs:S.imgs,log:S.log,club:S.club,xc:S.xc,alb:S.alb,hrs:S.hrs}))}catch(e){if(!save.w){save.w=1;alert("حافظه‌ی مرورگر پر است؛ بعضی تغییرها ذخیره نشد")}}}
function go(v){S.v=v;try{if(location.hash.slice(1)!=v)location.hash=v}catch(e){}const f=()=>{draw();scrollTo(0,0);const m=$("#app");m.tabIndex=-1;m.focus({preventScroll:true})};document.startViewTransition&&!matchMedia("(prefers-reduced-motion:reduce)").matches?document.startViewTransition(f):f()}
function nav(){const l=[["home","معرفی"],["areas","کافه‌ها"],["club","باشگاه"],["blog","وبلاگ"],["contact","تماس"]];
 $("#nav").innerHTML=`<span class="logo" onclick="go('home')">☕ کافه‌چی</span>`+l.map(x=>`<a class="${S.v==x[0]?"act":""}" onclick="go('${x[0]}')">${x[1]}</a>`).join("")+(S.u?(["admin","staff"].includes(S.u.role)?`<a onclick="go('admin')">پنل مدیریت</a>`:S.u.role=="owner"?`<a onclick="go('owner')">پنل سایت</a>`:`<a onclick="go('profile')">حساب من</a>`)+`<a onclick="S.u=null;save();go('home')">خروج</a>`:`<a onclick="go('login')">ورود</a>`)+`<a class="cartbtn" onclick="go('cart')" aria-label="سبد خرید">🛒${cn()?`<b>${fa(cn())}</b>`:""}</a>`}
function avg(c){const r=S.rate[c.id]||[];if(!r.length)return c.r;return ((c.r*5+r.reduce((a,b)=>a+(b[0]+b[1])/2,0))/(5+r.length)).toFixed(1)}
function stars(n){return `<span class="star">${"★".repeat(Math.round(n))}${"☆".repeat(5-Math.round(n))}</span> ${n}`}
function price(c){return "تومان".length&&"$".repeat(c.p).replace(/\$/g,"◈")}
const V={
home:()=>`<div class="hero"><div class="hero-t"><h1>کافه‌چی</h1><p>چای‌خانه‌ای در جیب شما؛ کافه‌های مشهد، یک‌جا.</p><p class="mu">محله‌تان را انتخاب کنید، از میان کافه‌های نزدیک یکی را برگزینید، سفارش دهید و با هر سفارش امتیاز بگیرید.</p><button class="btn" onclick="S.u?go('areas'):go('login')">شروع سفارش</button><button class="btn alt" onclick="go('areas')">دیدن کافه‌ها</button></div><button class="hero-c" onclick="mascotSay()" aria-label="سلام از چایی‌چی"><span class="evi" aria-hidden="true"></span><span class="mw"><img src="${(evCur()&&evCur()[1].mascot)||MASCOT}" width="547" height="820" alt="چایی‌چی، میزبان کافه‌چی" draggable="false"></span></button></div>
<div class="stats">${[["☕",CAFES.length,"کافه"],["📍",AREAS.length,"محله"],["🍰",CAFES.reduce((a,c)=>a+c.m.length,0),"آیتم منو"],["🎁",NEED(),"سفارش تا جایزه"]].map(x=>`<div><i>${x[0]}</i><b data-n="${x[1]}">0</b><span>${x[2]}</span></div>`).join("")}</div><div class="mq"><div>${"🍵 چای ذغالی ✦ ☕ قهوه ترک ✦ 🍰 شیرینی سنتی ✦ 🫖 دمنوش بهارنارنج ✦ ".repeat(6)}</div></div><h2>امروز چه می‌خواهید؟</h2><div class="cats">${CATS.map(c=>`<button class="cat" style="--bg1:${c[4]};${ims("cat:"+c[0])}" onclick="S.cat='${c[0]}';go('areas')"><b>${c[2]}</b><span>${c[1]}</span></button>`).join("")}</div><h2>کافه‌های برگزیده</h2><div class="sld" onmouseenter="sl.p=1" onmouseleave="sl.p=0" onfocusin="sl.p=1" onfocusout="sl.p=0" role="region" aria-label="معرفی کافه‌ها"><div class="trk" style="--i:${sl.i}">${CAFES.map((c,i)=>`<div class="sl" style="--bg1:${["var(--c1)","var(--c2)","var(--c3)"][i%3]};${ims("cafe:"+c.id,1)}"><div class="slt"><span class="slk">📍 ${c.a}</span><h3>${c.n}</h3><div>${stars(avg(c))}</div><div>سطح قیمت: ${price(c)}</div>${tag(c)}<button class="btn" onclick="goCafe(${c.id})">مشاهده و سفارش</button></div><div class="slg">${c.g.map(x=>`<b>${x}</b>`).join("")}</div></div>`).join("")}</div><button class="sla p" onclick="slSet(sl.i-1)" aria-label="قبلی">›</button><button class="sla n" onclick="slSet(sl.i+1)" aria-label="بعدی">‹</button><button class="sla ps" onclick="sl.h=!sl.h;draw()" aria-label="${sl.h?"پخش خودکار":"توقف خودکار"}">${sl.h?"▶":"⏸"}</button><div class="dots">${CAFES.map((c,i)=>`<button class="dot ${i==sl.i?"on":""}" onclick="slSet(${i})" aria-label="${c.n}"></button>`).join("")}</div></div><h2>سفارش در سه قدم</h2><div class="st3"><div><b>۱</b><em>📍</em>محله‌ات را انتخاب کن</div><div><b>۲</b><em>🍵</em>کافه و منو را ببین</div><div><b>۳</b><em>🎁</em>سفارش بده و امتیاز بگیر</div></div>${S.u&&S.u.role!="admin"?`<div class="card rw"><h3>🎁 جایزه‌ی بعدی شما</h3><div style="background:var(--ln);border-radius:8px;overflow:hidden"><div style="width:${Math.min(100,S.pts/NEED()*100)}%;background:var(--c3);height:14px"></div></div><p>${S.pts>=NEED()?"جایزه‌ات آماده است! در باشگاه دریافتش کن.":"فقط "+fa(NEED()-S.pts)+" سفارش دیگر تا "+REW()}</p><button class="btn" onclick="go('areas')">یک سفارش دیگر</button></div>`:`<div class="card rw"><h3>🎁 با اولین سفارش، باشگاه را شروع کن</h3><p>هر سفارش ۱ امتیاز؛ ۵ امتیاز = یک نوشیدنی رایگان.</p><button class="btn" onclick="go('login')">ورود و شروع</button></div>`}<h2>درباره کافه‌چی</h2><div class="grid"><div class="card"><h3>🍵 حال‌وهوای قدیم</h3>کافه‌چی کافه‌ها و چای‌خانه‌های محله‌های مشهد را کنار هم آورده تا انتخاب و سفارش ساده شود.</div><div class="card"><h3>🛵 حضوری یا پیک</h3>خودتان بیایید یا سفارش را به در خانه بفرستیم.</div><div class="card"><h3>🎁 باشگاه مشتریان</h3>با هر سفارش یک امتیاز؛ با ۵ امتیاز نوشیدنی هدیه بگیرید.</div><div class="card"><h3>⭐ رده‌بندی منصفانه</h3>کیفیت و قیمت هر کافه را شما امتیاز می‌دهید.</div></div><h2 id="own">کافه‌دار هستید؟ 🏺</h2><div class="own"><div class="card"><h3>مشتری بیشتر، دردسر کمتر</h3><ul class="ul"><li>سفارش آنلاین، حضوری و پیکی</li><li>لیست خرید خودکار وقتی چیزی تمام می‌شود</li><li>گزارش فروش، هزینه و سود</li><li>پنل پیامکی برای باشگاه مشتریان</li><li>مدیریت حضور و غیاب کارکنان</li></ul><input id="ln" placeholder="نام شما"><input id="lc" placeholder="نام کافه"><input id="lp" placeholder="شماره موبایل" inputmode="numeric" maxlength="11"><button class="btn" onclick="lead()">ثبت کافه‌ی من</button></div><div class="card calc"><h3>محاسبه‌ی فروش نمونه</h3>سفارش روزانه‌ی فعلی<input id="c1" type="number" value="40" oninput="calc()">میانگین هر سفارش (هزار تومان)<input id="c2" type="number" value="80" oninput="calc()">افزایش فروش از سفارش آنلاین: <b id="c3v"></b><input id="c3" type="range" min="0" max="40" value="10" oninput="calc()"><div class="res">فروش ماهانه‌ی فعلی: <b id="r1"></b> میلیون تومان<br>فروش اضافه در ماه: <b id="r2"></b> میلیون تومان</div><p class="mu">این فقط یک برآورد است و درصد افزایش را خودتان تعیین می‌کنید.</p></div></div>`,
login:()=>`<div class="card" style="max-width:400px;margin:auto"><h2>ورود</h2><p class="mu">شماره موبایل خود را وارد کنید. (نمایشی: کد تأیید ۱۲۳۴. شماره مدیر: ۰۹۱۲۰۰۰۰۰۰۰)</p><input id="ph" placeholder="09123456789" inputmode="numeric" maxlength="11"><div id="cw" style="display:none"><input id="cd" placeholder="کد تأیید" inputmode="numeric"></div><div id="er" class="mu"></div><button class="btn" id="lb" onclick="login()">دریافت کد</button></div>`,
areas:()=>`<div class="steps">مرحله ۱ از ۴ · محله</div>${favs()}<h2>بیشتر کجا هستید؟</h2><div class="grid">${AREAS.map(a=>`<div class="card pick" onclick="S.area='${a}';go('cafes')">📍 ${a}<div class="mu">${CAFES.filter(c=>c.a==a).length} کافه</div></div>`).join("")}</div>`,
cafes:()=>{const l=CAFES.filter(c=>c.a==S.area).sort((a,b)=>avg(b)-avg(a));return `<div class="steps">مرحله ۲ از ۴ · کافه‌های ${S.area}</div><h2>کافه‌های ${S.area}</h2>${l.length?`<div class="grid">${l.map(c=>`<div class="card"><h3>${c.n} <button class="hrt" onclick="fav(${c.id})" aria-label="علاقه‌مندی">${(S.fav||[]).includes(c.id)?"❤️":"🤍"}</button></h3><div class="gal">${c.g.map(x=>`<div>${x}</div>`).join("")}</div>${stars(avg(c))}<div class="mu">سطح قیمت: ${price(c)}</div>${tag(c)}<label class="mu"><input type="checkbox" style="width:auto" ${S.cmp.includes(c.id)?"checked":""} onchange="cmp(${c.id})"> مقایسه</label><br><button class="btn" onclick="S.cafe=${c.id};S.cart={};go('cafe')">انتخاب</button></div>`).join("")}</div>`:"<p>هنوز کافه‌ای ثبت نشده.</p>"}${l.length?`<h3>نقشه‌ی کافه‌های ${S.area}</h3>${mapCafes(l)}`:""}<button class="btn alt" onclick="go('areas')">تغییر محله</button><button class="btn alt" onclick="go('compare')">مقایسه (${S.cmp.length})</button>`},
cafe:()=>{const c=CAFES.find(x=>x.id==S.cafe),t=total(c);return `<div class="cf-head"><div class="steps">مرحله ۳ از ۴ · سفارش</div><h2>${c.n}</h2>${tag(c)}${spBan(c)}<div class="orn"><span>${orn()}</span></div></div>${albumHtml(c)}<div class="card">${chips()}${menu(c).map((m,i)=>!inCat(m)?"":`<div class="row"><span>${m[0]}${S.spec&&S.spec.on&&c.id==1&&S.spec.n==m[0]?" ⭐":""}<span class="mu"> · ${fa(m[1])} هزار تومان</span></span>${S.stock[c.id+"|"+m[0]]?`<b class="mu">ناموجود</b>`:`<span><button class="btn alt" onclick="add(${i},-1)">−</button> ${fa(S.cart[i]||0)} <button class="btn" onclick="add(${i},1)">+</button></span>`}</div>`).join("")}</div><div class="card" style="margin-top:12px"><b>نحوه دریافت</b><br><label><input type="radio" style="width:auto" name="md" ${S.mode=="in"?"checked":""} onchange="S.mode='in';draw()"> دریافت حضوری</label> &nbsp; <label><input type="radio" style="width:auto" name="md" ${S.mode=="out"?"checked":""} onchange="S.mode='out';draw()"> ارسال با پیک (بر اساس فاصله)</label>${S.mode=="out"?`${courierForm(c)}`:`<p class="mu">زمان آماده‌سازی حدود ۱۰ دقیقه؛ سفارش را در کافه تحویل بگیرید.</p>`}${(b=>`<p class="mu">جمع اقلام: ${fa(b.t)} هزار${b.first?` · 🎁 تخفیف اولین سفارش (۱۰٪): −${fa(b.disc)}`:""}${b.fee?` · پیک: ${fa(b.fee)}`:""}</p><h3>مبلغ قابل پرداخت: ${fa(b.tot)} هزار تومان</h3>`)(sum(c))}<button class="btn" onclick="pay()">پرداخت آنلاین و ثبت سفارش</button></div>`},
done:()=>{const c=CAFES.find(x=>x.id==S.cafe);return `<div class="steps">مرحله ۴ از ۴ · پایان</div><h2>سفارش ثبت شد ✔</h2><p class="ok">۱ امتیاز به باشگاه شما اضافه شد. مجموع: ${fa(S.pts)}</p>${S.orders.find(x=>x.id==S.last)?tk(S.orders.find(x=>x.id==S.last)):""}<p>${(S.tmpOrder||{}).mode=="out"?"پیک به‌زودی سفارش را می‌رساند 🛵":"سفارش شما در کافه آماده می‌شود ☕"}</p><div class="card"><h3>به ${c.n} امتیاز بدهید</h3>قیمت: <select id="r1">${[5,4,3,2,1].map(x=>`<option>${x}</option>`)}</select> کیفیت سرو: <select id="r2">${[5,4,3,2,1].map(x=>`<option>${x}</option>`)}</select><br><button class="btn" onclick="rate()">ثبت امتیاز</button></div>`},

function fmt(t){return new Date(t).toLocaleString("fa-IR",{dateStyle:"short",timeStyle:"short"})}
function tbl(h,r){return `<table><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr>${r.map(a=>`<tr>${a.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</table>`}
function prn(t,b){const a=document.createElement("div");a.id="pa";a.innerHTML=`<h1>${t}</h1><p>${CF().n} · ${fmt(Date.now())}</p>${b}`;document.body.appendChild(a);document.body.classList.add("pr");setTimeout(()=>{try{print()}catch(e){alert("چاپ در این محیط ممکن نیست")}a.remove();document.body.classList.remove("pr")},80)}
function wk(){const d=[],iso=x=>x.toISOString().slice(0,10),base=[420,380,510,460,600,720,0];for(let i=6;i>=0;i--){const x=new Date();x.setDate(x.getDate()-i);d.push(x)}return d.map((x,i)=>[x.toLocaleDateString("fa-IR"),base[i]+S.orders.filter(o=>o.c==CID()&&(o.d||iso(new Date()))==iso(x)).reduce((a,o)=>a+o.t,0)])}
function exFin(){const rev=S.orders.filter(o=>o.c==CID()).reduce((a,o)=>a+o.t,0),cost=Math.round(rev*.4),sal=S.staff.reduce((a,s)=>a+s[2],0);prn("گزارش فروش و هزینه‌ها",`<h3>فروش هفت روز اخیر (هزار تومان)</h3>${tbl(["تاریخ","فروش"],wk().map(r=>[r[0],fa(r[1])]))}<p>روزهای قبل از امروز نمونه‌اند.</p><h3>خلاصه مالی (هزار تومان)</h3>${tbl(["ورودی فروش","هزینه مواد","حقوق روزانه","سود خالص"],[[fa(rev),fa(cost),fa(sal),fa(rev-cost-sal)]])}`)}
function exBuy(){const l=Object.keys(S.stock).filter(k=>S.stock[k]&&k.startsWith(CID()+"|"));prn("لیست خرید کافه",l.length?tbl(["ردیف","کالا","خریداری شد؟"],l.map((k,i)=>[fa(i+1),k.slice(k.indexOf("|")+1),"☐"])):"<p>همه‌چیز موجود است.</p>")}
function exAtt(){const r=[];S.staff.forEach(s=>(S.att[s[0]]||[]).forEach(x=>r.push([s[0],s[1],fmt(x[0]),x[1]?fmt(x[1]):"حاضر",x[1]?fa(((x[1]-x[0])/36e5).toFixed(1)):"—"])));prn("گزارش زمان حضور کارکنان",r.length?tbl(["نام","سمت","ورود","خروج","ساعت"],r):"<p>رکوردی ثبت نشده.</p>")}
function exHrs(){const l=S.hlog||[];prn("گزارش ساعات کار و وضعیت کافه",`<p>ساعت کار فعلی: ${S.hrs.o} تا ${S.hrs.c} · وضعیت: ${S.hrs.open?"باز":"بسته"}</p>`+(l.length?tbl(["زمان","رویداد"],l.map(x=>[fmt(x[0]),x[1]])):"<p>رکوردی ثبت نشده.</p>"))}
function hlg(e){(S.hlog=S.hlog||[]).push([Date.now(),e]);save()}
function hl(){const l=S.hlog||[];return `<h3>سابقه‌ی ثبت‌شده</h3>${l.slice(-6).reverse().map(x=>`<div class="row"><span>${fmt(x[0])}</span><span>${x[1]}</span></div>`).join("")||"<p class='mu'>هنوز رکوردی ثبت نشده.</p>"}<button class="btn alt" onclick="exHrs()">🖨 خروجی و چاپ</button>`}
const sl={i:0,p:0};
function slSet(i){const n=CAFES.length,t=document.querySelector(".trk");sl.i=(i+n)%n;if(!t)return;t.style.setProperty("--i",sl.i);document.querySelectorAll(".dot").forEach((d,k)=>d.classList.toggle("on",k==sl.i))}
function goCafe(id){const c=CAFES.find(x=>x.id==id);S.area=c.a;S.cafe=id;S.cart={};go("cafe")}
setInterval(()=>{if(!sl.p&&!sl.h&&!matchMedia("(prefers-reduced-motion:reduce)").matches)slSet(sl.i+1)},4500);
addEventListener("pointerdown",e=>{const t=e.target.closest&&e.target.closest(".sld");sl.x=t?e.clientX:null});
addEventListener("pointerup",e=>{if(sl.x==null)return;const d=e.clientX-sl.x;sl.x=null;if(Math.abs(d)>40)slSet(sl.i+(d>0?1:-1))});
function cnt(){document.querySelectorAll("[data-n]").forEach(el=>{const n=+el.dataset.n,t0=performance.now(),f=t=>{const k=Math.min(1,(t-t0)/1200);el.textContent=fa(Math.round(n*(1-Math.pow(1-k,3))));if(k<1)requestAnimationFrame(f)};matchMedia("(prefers-reduced-motion:reduce)").matches?el.textContent=fa(n):requestAnimationFrame(f)});if(document.getElementById("c1"))calc()}
function calc(){const o=+$("#c1").value||0,p=+$("#c2").value||0,x=+$("#c3").value,m=o*p*30;$("#c3v").textContent=fa(x)+"٪";$("#r1").textContent=fa((m/1000).toFixed(1));$("#r2").textContent="+"+fa((m*x/100000).toFixed(1))}
function lead(){const n=clean($("#ln").value),p=$("#lp").value.trim(),c=clean($("#lc").value);if(!n||!c||!/^09\d{9}$/.test(p))return alert("نام، نام کافه و شماره معتبر را وارد کنید");(S.leads=S.leads||[]).push({n,p,c,t:Date.now()});save();alert("درخواست ثبت شد ☕ (نسخه‌ی نمایشی)");["ln","lp","lc"].forEach(i=>$("#"+i).value="")}
function reorder(k){const o=S.orders[k];S.cafe=o.c;S.cart={...o.i};go("cafe")}
const fab=document.createElement("button");fab.className="btn fab";fab.textContent="☕ سفارش بده";fab.onclick=()=>S.u?go("areas"):go("login");document.body.appendChild(fab);
addEventListener("scroll",()=>fab.classList.toggle("show",S.v=="home"&&scrollY>420),{passive:true});
